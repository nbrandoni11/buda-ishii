<body>
<main id="shell"><div class="top"><div class="brand"><img class="brand-avatar" src="buda-ishii-cover-transparent.png" alt=""><h1>BUDA ISHII</h1></div><p>Construí futuro. Defendé los sueños.</p></div><div class="wrap" style="aspect-ratio:16 / 9">
  <canvas id="game" width="960" height="540" aria-label="Juego Buda Ishii"></canvas>
  <div id="start" class="screen cover-screen"><div class="cover-panel"><div class="cover-copy"><h2>BUDA<br>ISHII</h2><p>Construí escuelas, hospitales y universidades mientras defendés cada obra.</p><button class="btn" id="play">JUGAR</button></div><img class="cover-art" src="buda-ishii-cover-transparent.png" alt="Buda Ishii, personaje pixel art haciendo el gesto de la victoria"></div></div>
  <div id="end" class="screen hidden"><div class="panel"><h2 id="endTitle">¡CIUDAD IMPARABLE!</h2><p id="endText"></p><button class="btn" id="again">JUGAR DE NUEVO</button></div></div>
</div><div id="startActions"><button class="btn" id="playMobile">JUGAR</button></div><div id="touch"><div class="dpad"><button aria-label="Mover arriba" class="ctrl" data-k="up">▲</button><button aria-label="Mover a la izquierda" class="ctrl" data-k="left">◀</button><button aria-label="Mover a la derecha" class="ctrl" data-k="right">▶</button><button aria-label="Mover abajo" class="ctrl" data-k="down">▼</button></div><button aria-label="Mantener presionado para construir" class="action build" data-k="build">🏗<small>CONSTRUIR</small></button><button aria-label="Disparar un libro" class="action" data-k="fire">▰<small>DISPARAR<br>LIBRO</small></button></div></main>
<script>
const c=document.getElementById('game'),x=c.getContext('2d');x.imageSmoothingEnabled=false;
const W=960,H=540,keys={},stars=Array.from({length:55},()=>({x:Math.random()*1280,y:Math.random()*165,s:Math.random()<.7?2:3}));
let state,raf,last=0;
const levels=[
 {worldW:960,worldH:540,roads:[[345,60]],spawnBase:170,minSpawn:48,enemySpeed:.80,enemyHp:2,damage:.13,moveSpeed:2.7,projects:[
  [260,310,'ESCUELA',4,'#efb735'],[700,310,'HOSPITAL',7,'#e9e8df'],[260,500,'UNIVERSIDAD',10,'#9d79d6'],[700,500,'VIVIENDAS',13,'#e27636']
 ]},
 {worldW:1120,worldH:630,roads:[[390,72]],spawnBase:142,minSpawn:38,enemySpeed:.98,enemyHp:3,damage:.16,moveSpeed:3.15,projects:[
  [170,350,'ESCUELA',8,'#efb735'],[560,350,'HOSPITAL',11,'#e9e8df'],[950,350,'LABORATORIO',14,'#47b9a4'],[170,580,'POLO TECNOLÓGICO',17,'#3da8c5'],[560,580,'CENTRO DEPORTIVO',20,'#5bc66f'],[950,580,'GRAN OBRA',23,'#db6155']
 ]},
 {worldW:1280,worldH:720,roads:[[340,60],[520,60]],spawnBase:118,minSpawn:30,enemySpeed:1.14,enemyHp:4,damage:.19,moveSpeed:3.55,projects:[
  [200,310,'ESCUELA',12,'#efb735'],[640,310,'HOSPITAL',15,'#e9e8df'],[1080,310,'UNIVERSIDAD',18,'#9d79d6'],[350,498,'LABORATORIO',21,'#47b9a4'],[930,498,'POLO TECNOLÓGICO',24,'#3da8c5'],[200,680,'VIVIENDAS',27,'#e27636'],[640,680,'CENTRO DEPORTIVO',30,'#5bc66f'],[1080,680,'GRAN OBRA',33,'#db6155']
 ]}
];
function loadLevel(levelIndex,score=0){let l=levels[levelIndex];Object.keys(keys).forEach(k=>keys[k]=false);state={run:true,t:0,score,confidence:100,levelIndex,worldW:l.worldW,worldH:l.worldH,scale:W/l.worldW,player:{x:l.worldW/2,y:l.worldH*.63,vx:0,vy:0,face:1,cool:0,throwT:0},pads:l.projects.map((p,i)=>({x:p[0],y:p[1],type:p[2],seconds:p[3],color:p[4],index:i,done:false,build:0})),people:[],haters:[],shots:[],sparks:[],spawn:0,active:0,msg:`NIVEL ${levelIndex+1} · ANDÁ A LA PRIMERA OBRA`,msgT:210,building:false,transition:0,levelCleared:false};}
function reset(){loadLevel(0,0)}
function rect(a,b,w,h,col){x.fillStyle=col;x.fillRect(Math.round(a),Math.round(b),w,h)}
function text(t,a,b,size=18,col='#fff',align='left'){x.fillStyle=col;x.font=`${size}px VT323`;x.textAlign=align;x.fillText(t,a,b)}
function bg(){let ww=state.worldW,wh=state.worldH,l=levels[state.levelIndex];rect(0,0,ww,wh,'#74c7df');stars.forEach(s=>{if(s.x<ww)rect(s.x,s.y,s.s,s.s,'#d9f6ff')});rect(0,145,ww,70,'#bfe26e');rect(0,215,ww,wh-215,'#6eb95d');for(let i=0;i<Math.ceil(ww/84)+1;i++){let bx=i*84-20,h=45+(i%4)*18;rect(bx,175-h,67,h,'#adc0c0');rect(bx+8,186-h,10,8,'#5e7787');rect(bx+38,186-h,10,8,'#5e7787')}l.roads.forEach(([roadY,roadH])=>{rect(0,roadY,ww,roadH,'#646c72');rect(0,roadY+3,ww,4,'#f4d44c');rect(0,roadY+roadH-7,ww,4,'#f4d44c');for(let i=0;i<Math.ceil(ww/125);i++)rect(i*125,roadY+Math.round(roadH/2)-3,72,6,'#dfe2d8')})}
function drawPad(p){let locked=p.index>state.active;if(locked)x.globalAlpha=.35;let stage=p.done?100:p.build,h=18+stage*.72;rect(p.x-63,p.y+12,126,9,'#263049');rect(p.x-63,p.y+12,126*stage/100,9,p.done?'#54d978':'#ffd24a');text(p.done?'COMPLETA':`${Math.floor(stage)}%`,p.x,p.y+38,17,locked?'#95a0af':'#fff','center');if(stage<1){rect(p.x-52,p.y-23,104,35,'#8b7044');for(let i=0;i<5;i++)rect(p.x-44+i*20,p.y-16,14,9,'#dc9844');text(p.type,p.x,p.y-34,p.type.length>13?14:18,locked?'#8f9aaa':'#fff','center')}else{rect(p.x-58,p.y-h+12,116,h,p.color);rect(p.x-66,p.y-h,132,14,p.type==='HOSPITAL'?'#e33f4b':'#9b3e3d');for(let r=0;r<3;r++)for(let q=0;q<4;q++)rect(p.x-46+q*27,p.y-h+24+r*18,18,11,'#79c6df');rect(p.x-12,p.y-12,24,24,'#5a4236');if(p.type==='HOSPITAL'){rect(p.x-7,p.y-h+20,14,34,'#e33f4b');rect(p.x-19,p.y-h+31,38,12,'#e33f4b')}text(p.type,p.x,p.y-h-7,p.type.length>13?14:17,'#fff','center')}if(state.active===p.index&&!p.done){x.strokeStyle=state.building?'#fff':'#ffd24a';x.lineWidth=3;x.strokeRect(p.x-70,p.y-h-12,140,h+64)}x.globalAlpha=1}
function buda(p){let a=Math.round(p.x),b=Math.round(p.y)+Math.sin(state.t*.18)*1.5;rect(a-16,b+8,32,22,'#101522');rect(a-19,b-7,38,19,'#141925');x.save();x.translate(a,b);x.rotate(-.68);rect(-5,-9,10,40,'#cf2f3d');x.restore();rect(a-15,b-28,30,24,'#e0a273');rect(a-18,b-33,36,11,'#101522');rect(a-15,b-38,14,9,'#101522');rect(a,b-40,17,10,'#101522');rect(a-12,b-17,8,4,'#1b2030');rect(a+5,b-17,8,4,'#1b2030');rect(a-6,b-8,13,4,'#a33d60');rect(a-17,b+28,12,7,'#0d111b');rect(a+6,b+28,12,7,'#0d111b');if(p.throwT>0){rect(a+p.face*17,b-4,12,6,'#e1aa78');rect(a+p.face*28,b-7,12,9,'#f4e8b3')}else{rect(a+13,b-3,7,14,'#e1aa78');rect(a+14,b-11,4,10,'#e1aa78');rect(a+20,b-10,4,10,'#e1aa78')}}
function drawPerson(p){rect(p.x-6,p.y-10,12,17,p.col);rect(p.x-5,p.y-17,10,8,p.skin);rect(p.x-6,p.y-20,12,5,p.hair);rect(p.x-5,p.y+7,4,7,'#24304a');rect(p.x+2,p.y+7,4,7,'#24304a');if(p.star)text('★',p.x,p.y-25,16,'#ffd345','center')}
function drawHater(h){let bob=Math.sin(state.t*.2+h.seed)*3;rect(h.x-12,h.y-12+bob,24,24,'#4b2f63');rect(h.x-8,h.y-22+bob,16,12,'#6e4389');rect(h.x-12,h.y-24+bob,8,8,'#293040');rect(h.x+4,h.y-24+bob,8,8,'#293040');rect(h.x-7,h.y-18+bob,5,4,'#ff4f64');rect(h.x+3,h.y-18+bob,5,4,'#ff4f64');rect(h.x-8,h.y+12+bob,6,8,'#33243f');rect(h.x+3,h.y+12+bob,6,8,'#33243f')}
function dist(a,b){return Math.hypot(a.x-b.x,a.y-b.y)}
function update(){let s=state,l=levels[s.levelIndex];if(s.transition>0){s.transition--;s.t++;if(s.transition===0){if(s.levelIndex<levels.length-1)loadLevel(s.levelIndex+1,s.score);else finish(true)}return}let p=s.player,sp=l.moveSpeed;p.vx=((keys.right||keys.ArrowRight||keys.d)?1:0)-((keys.left||keys.ArrowLeft||keys.a)?1:0);p.vy=((keys.down||keys.ArrowDown||keys.s)?1:0)-((keys.up||keys.ArrowUp||keys.w)?1:0);if(p.vx&&p.vy){p.vx*=.707;p.vy*=.707}p.x=Math.max(25,Math.min(s.worldW-25,p.x+p.vx*sp));p.y=Math.max(180,Math.min(s.worldH-35,p.y+p.vy*sp));if(p.vx)p.face=Math.sign(p.vx);p.cool--;p.throwT--;
  let q=s.pads[s.active],near=q&&dist(p,q)<78;s.building=!!(q&&near&&(keys.build||keys[' ']||keys.Spacebar));if(s.building){q.build=Math.min(100,q.build+100/(q.seconds*60));if(q.build>=100&&!q.done){q.done=true;let earned=500+(q.index*150)+(s.levelIndex*300);s.score+=earned;s.msg=`¡${q.type} INAUGURADA! +${earned}`;s.msgT=130;for(let i=0;i<3;i++)setTimeout(()=>state&&state.run&&state.levelIndex===s.levelIndex&&spawnPerson(q),i*400);s.active++;if(s.active>=s.pads.length&&!s.levelCleared){s.levelCleared=true;s.transition=180;s.haters=[];s.shots=[];s.msg=`¡NIVEL ${s.levelIndex+1} COMPLETO!`;s.msgT=180;return}}}else if((keys.build||keys[' '])&&!near){s.msg='ACERCATE A LA OBRA MARCADA';s.msgT=35}
  if((keys.fire||keys.Control)&&p.cool<=0){p.cool=18;p.throwT=10;s.shots.push({x:p.x+p.face*18,y:p.y-8,vx:p.face*8,life:65,spin:0});keys.fire=false}
  s.shots.forEach(o=>{o.x+=o.vx;o.life--;s.haters.forEach(h=>{if(!h.dead&&dist(o,h)<20){h.hp--;o.life=0;if(h.hp<=0){h.dead=true;s.score+=100;for(let i=0;i<7;i++)s.sparks.push({x:h.x,y:h.y,vx:Math.random()*4-2,vy:Math.random()*-3-1,life:35})}}})});s.shots=s.shots.filter(o=>o.life>0);s.haters=s.haters.filter(h=>!h.dead);
  s.spawn++;let interval=Math.max(l.minSpawn,l.spawnBase-s.active*(14+s.levelIndex*2));if(s.spawn>interval){s.spawn=0;s.haters.push({x:Math.random()<.5?-18:s.worldW+18,y:215+Math.random()*(s.worldH-250),hp:l.enemyHp+Math.floor(s.active/4),seed:Math.random()*6})}
  s.people.forEach(o=>{o.x+=o.vx;o.y+=o.vy;if(o.x<30||o.x>s.worldW-30)o.vx*=-1;if(o.y<230||o.y>s.worldH-40)o.vy*=-1});s.haters.forEach(h=>{let dx=p.x-h.x,dy=p.y-h.y,d=Math.hypot(dx,dy)||1;h.x+=dx/d*(l.enemySpeed+s.active*.045);h.y+=dy/d*(l.enemySpeed+s.active*.045);if(d<22){s.confidence-=l.damage;p.x=Math.max(25,Math.min(s.worldW-25,p.x+dx/d*1.4));p.y=Math.max(180,Math.min(s.worldH-35,p.y+dy/d*1.4))}});s.sparks.forEach(z=>{z.x+=z.vx;z.y+=z.vy;z.vy+=.12;z.life--});s.sparks=s.sparks.filter(z=>z.life>0);s.msgT--;s.t++;
  if(s.confidence<=0)finish(false);
}
function spawnPerson(q){let colors={ESCUELA:'#4bc0d8',HOSPITAL:'#e8eef1',UNIVERSIDAD:'#9d79d6',LABORATORIO:'#47b9a4','POLO TECNOLÓGICO':'#4ed1d0',VIVIENDAS:'#ed9f36','CENTRO DEPORTIVO':'#61d477','GRAN OBRA':'#f06c66'};state.people.push({x:q.x,y:q.y+18,vx:(Math.random()-.5)*1.1,vy:.5+Math.random()*.5,col:colors[q.type]||'#4bc0d8',skin:['#8f573f','#d49a6a','#f0bd8b'][Math.floor(Math.random()*3)],hair:'#25202a',star:true});state.score+=50}
function render(){x.save();x.scale(state.scale,state.scale);bg();state.pads.forEach(drawPad);state.people.forEach(drawPerson);state.haters.forEach(drawHater);state.shots.forEach(o=>{o.spin+=.15;x.save();x.translate(o.x,o.y);x.rotate(o.spin);rect(-10,-7,20,14,'#f3e7b8');rect(-1,-7,2,14,'#b14d49');x.restore()});state.sparks.forEach(z=>rect(z.x,z.y,3,3,'#ffd24a'));buda(state.player);x.restore();
  rect(14,14,430,74,'#101525dd');text(`PUNTOS  ${state.score}`,28,40,24,'#ffd24a');text('CONFIANZA',28,67,18,'#fff');rect(132,53,285,15,'#3b4051');rect(132,53,Math.max(0,285*state.confidence/100),15,state.confidence>35?'#54d978':'#ff5365');text(`${Math.max(0,Math.floor(state.confidence))}%`,275,66,17,'#101525','center');
  let built=state.pads.filter(q=>q.done).length;text(`OBRAS ${built}/${state.pads.length}   NIVEL ${state.levelIndex+1}/${levels.length}`,946,38,22,'#fff','right');let q=state.pads[state.active];if(q)text(`${q.type} · ${q.seconds}s`,946,66,20,'#ffd24a','right');if(state.msgT>0){rect(275,474,410,42,'#101525dd');text(state.msg,480,503,23,'#ffd24a','center')}text('ESPACIO: construir · CTRL: disparar libro',946,513,18,'#dbe6ff','right');if(state.transition>0){rect(230,180,500,165,'#101525ee');text(`NIVEL ${state.levelIndex+1} COMPLETO`,480,235,38,'#ffd24a','center');text(state.levelIndex<levels.length-1?`Preparando nivel ${state.levelIndex+2}...`:'¡Toda la ciudad está construida!',480,285,28,'#fff','center');text(`PUNTOS ${state.score}`,480,325,24,'#54d978','center')}
}
function loop(t){if(!state||!state.run)return;let dt=t-last;if(dt>14){update();render();last=t}raf=requestAnimationFrame(loop)}
function finish(win){state.run=false;cancelAnimationFrame(raf);document.getElementById('end').classList.remove('hidden');document.getElementById('endTitle').textContent=win?'¡LOS 3 NIVELES COMPLETOS!':'LOS MONSTRUOS GANARON ESTA VEZ';document.getElementById('endText').innerHTML=win?`Transformaste la ciudad completando ${levels.reduce((n,l)=>n+l.projects.length,0)} obras públicas.<br><span class="yellow">Puntaje final: ${state.score}</span>`:`Llegaste al nivel ${state.levelIndex+1}. Alterná entre construir y defenderte con los libros.<br><span class="yellow">Puntaje: ${state.score}</span>`}
function start(){document.getElementById('start').classList.add('hidden');document.getElementById('end').classList.add('hidden');reset();render();last=performance.now();raf=requestAnimationFrame(loop)}
addEventListener('keydown',e=>{keys[e.key]=true;if(e.code==='Space'){keys.build=true;e.preventDefault()}});addEventListener('keyup',e=>{keys[e.key]=false;if(e.code==='Space')keys.build=false});document.querySelectorAll('[data-k]').forEach(b=>{let k=b.dataset.k;b.addEventListener('pointerdown',e=>{e.preventDefault();b.setPointerCapture(e.pointerId);keys[k]=true});b.addEventListener('pointerup',e=>{e.preventDefault();keys[k]=false});b.addEventListener('pointercancel',()=>keys[k]=false)});document.getElementById('play').onclick=start;document.getElementById('playMobile').onclick=start;document.getElementById('again').onclick=start;reset();state.run=false;render();
</script>
</body></html>
