<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
  <meta name="theme-color" content="#101525">
  <title>Buda Ishii</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap');
    *{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#080b14;color:#fff;font-family:'VT323',monospace;overflow:hidden}
    body{display:grid;place-items:center;background:radial-gradient(circle at 50% 25%,#283558 0,#101525 42%,#070a11 100%)}
    #shell{width:min(100vw,1180px);height:100dvh;display:flex;flex-direction:column;justify-content:center;gap:10px;padding:10px}
    .top{display:flex;align-items:end;justify-content:space-between;padding:0 4px}
    h1{font-family:'Press Start 2P';font-size:clamp(18px,3vw,34px);margin:0;color:#ffd24a;text-shadow:4px 4px 0 #7c2436;letter-spacing:-1px}
    .top p{font-size:20px;margin:0;color:#a9b9d5}.wrap{position:relative;aspect-ratio:16/9;max-height:calc(100dvh - 110px);margin:auto;box-shadow:0 0 0 4px #29324a,0 0 0 8px #080b14,0 18px 60px #000;image-rendering:pixelated}
    canvas{display:block;width:100%;height:100%;background:#8ed4e7;image-rendering:pixelated;touch-action:none}
    .screen{position:absolute;inset:0;background:linear-gradient(#101525e8,#070a11f2);display:grid;place-items:center;text-align:center;padding:6%;z-index:4}
    .panel{max-width:700px}.cover-screen{overflow:hidden;background:radial-gradient(circle at 70% 35%,#f6d267 0,#b84142 34%,#17182b 72%)}.cover-screen:before{content:'';position:absolute;inset:auto 0 0;height:25%;background:repeating-linear-gradient(90deg,#11182a 0 50px,#19243a 50px 96px);clip-path:polygon(0 54%,8% 25%,16% 58%,25% 12%,34% 48%,46% 22%,55% 62%,66% 18%,76% 47%,88% 8%,100% 45%,100% 100%,0 100%)}.cover-panel{position:relative;z-index:1;width:min(900px,100%);display:grid;grid-template-columns:1fr 1fr;align-items:center;gap:22px;text-align:left}.cover-copy{text-shadow:4px 4px 0 #191426}.cover-copy h2{font-size:clamp(32px,5.2vw,62px);line-height:1.18;margin-bottom:20px}.cover-copy .kicker{display:inline-block;font-family:'Press Start 2P';font-size:12px;letter-spacing:1px;color:#161526;background:#ffd24a;padding:9px 12px;margin-bottom:15px;box-shadow:4px 4px 0 #7c2436}.cover-copy p{font-size:25px;max-width:470px}.cover-art{width:100%;max-height:480px;object-fit:contain;image-rendering:pixelated;filter:drop-shadow(14px 18px 0 #16152566);border:5px solid #fff;box-shadow:0 0 0 5px #17182b;transform:rotate(1deg)}.cover-copy .btn{font-size:16px;padding:18px 28px}.hero{width:132px;height:132px;margin:0 auto 18px;position:relative;image-rendering:pixelated}.pixel-head{position:absolute;inset:22px 20px 8px;background:#e7aa77;box-shadow:0 0 0 7px #843c35,0 0 0 12px #171c2c;clip-path:polygon(12% 0,86% 0,100% 22%,94% 80%,72% 100%,28% 100%,6% 80%,0 22%)}.pixel-head:before{content:'';position:absolute;left:13px;top:-23px;width:88px;height:35px;background:#111827;clip-path:polygon(0 82%,10% 22%,25% 30%,34% 4%,48% 25%,70% 0,65% 32%,100% 18%,87% 100%)}.eyes{position:absolute;left:21px;top:43px;width:65px;height:9px;border-top:5px solid #1b2030;border-radius:50%}.eyes:after{content:'';position:absolute;left:48px;top:-5px;width:18px;height:9px;border-top:5px solid #1b2030;border-radius:50%}.smile{position:absolute;left:38px;top:67px;width:32px;height:17px;border-bottom:6px solid #9e3655;border-radius:50%}
    body:has(#start:not(.hidden)) .top{display:none}body:has(#start:not(.hidden)) #shell{gap:0}.cover-screen{background:linear-gradient(90deg,#081221e8 0%,#10182ab8 34%,#10182a36 67%,#10182a15 100%),url('buda-ishii-city-bg.png') center/cover no-repeat}.cover-screen:before{display:none}.cover-panel{grid-template-columns:46% 54%;width:min(960px,100%)}.cover-copy{padding:28px 22px;background:linear-gradient(90deg,#09101ee6,#11182a80 76%,transparent);border-left:6px solid #ffd24a}.cover-copy h2{font-size:clamp(38px,6vw,68px);line-height:1.08;margin-bottom:20px}.cover-art{width:116%;margin-left:-10%;max-height:530px;border:0;box-shadow:none;filter:drop-shadow(12px 16px 0 #050b1466)}
    .panel h2{font-family:'Press Start 2P';font-size:clamp(19px,3.4vw,34px);line-height:1.35;margin:0 0 16px;color:#ffd24a}.panel p{font-size:clamp(21px,2.6vw,30px);line-height:1.1;color:#dbe6ff;margin:9px 0}.yellow{color:#ffd24a}.red{color:#ff5b62}.btn{border:0;background:#f0c22e;color:#191522;font-family:'Press Start 2P';font-size:14px;padding:16px 22px;margin-top:18px;box-shadow:0 6px 0 #a85b29;cursor:pointer}.btn:active{transform:translateY(4px);box-shadow:0 2px 0 #a85b29}
    #touch{display:none;position:absolute;inset:0;pointer-events:none;z-index:3}.dpad{position:absolute;left:18px;bottom:18px;width:142px;height:142px}.ctrl,.action{pointer-events:auto;position:absolute;border:3px solid #fff9;background:#111a2be8;color:#fff;font:28px monospace;border-radius:9px;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:4px;user-select:none;-webkit-user-select:none;touch-action:none;box-shadow:0 5px 0 #070b14aa}.ctrl[data-k=up]{left:49px;top:0}.ctrl[data-k=down]{left:49px;bottom:0}.ctrl[data-k=left]{left:0;top:49px}.ctrl[data-k=right]{right:0;top:49px}.ctrl{width:46px;height:46px}.action{right:16px;bottom:18px;width:106px;height:78px;font-family:'Press Start 2P';font-size:22px;background:#bc3149ed}.action small{font:12px 'Press Start 2P';line-height:1.2}.build{right:132px;bottom:18px;width:112px;height:78px;background:#d09e26ed}.action:active{transform:translateY(4px);box-shadow:0 1px 0 #070b14aa;filter:brightness(1.25)}
    .hidden{display:none!important}@media (pointer:coarse),(max-width:760px){#touch{display:block}.top p{display:none}#shell{padding:6px;justify-content:flex-start}.wrap{width:100%;margin:auto;max-height:calc(100dvh - 58px)}h1{font-size:17px}.btn{font-size:12px}.screen{padding:4%}.hero{transform:scale(.72);margin:-14px auto -2px}.panel p{font-size:19px}.dpad{left:12px;bottom:12px;transform:scale(.9);transform-origin:bottom left}.action{bottom:12px}.build{right:130px}.cover-panel{grid-template-columns:48% 52%;gap:2px}.cover-copy{padding:15px 10px}.cover-copy h2{font-size:clamp(27px,8vw,46px);margin-bottom:9px}.cover-copy p{font-size:16px;margin:5px 0}.cover-copy .btn{font-size:11px;padding:12px 15px;margin-top:8px}.cover-art{max-height:78dvh}}@media (max-width:540px) and (orientation:portrait){.cover-screen{background-position:58% center}.cover-panel{grid-template-columns:1fr;text-align:center}.cover-art{position:absolute;right:-11%;bottom:-16%;width:62%;opacity:.92}.cover-copy{z-index:2;width:78%;background:#081221d9}.cover-copy p{max-width:92%;margin:7px auto}.cover-copy .btn{margin-top:10px}}
  </style>
</head>
<body>
<main id="shell"><div class="top"><h1>BUDA ISHII</h1><p>Construí futuro. Defendé los sueños.</p></div><div class="wrap">
  <canvas id="game" width="960" height="540" aria-label="Juego Buda Ishii"></canvas>
  <div id="start" class="screen cover-screen"><div class="cover-panel"><div class="cover-copy"><h2>BUDA<br>ISHII</h2><p>Construí escuelas, hospitales y universidades mientras defendés cada obra.</p><button class="btn" id="play">JUGAR</button></div><img class="cover-art" src="buda-ishii-cover-transparent.png" alt="Buda Ishii, personaje pixel art haciendo el gesto de la victoria"></div></div>
  <div id="end" class="screen hidden"><div class="panel"><h2 id="endTitle">¡CIUDAD IMPARABLE!</h2><p id="endText"></p><button class="btn" id="again">JUGAR DE NUEVO</button></div></div>
  <div id="touch"><div class="dpad"><button aria-label="Mover arriba" class="ctrl" data-k="up">▲</button><button aria-label="Mover a la izquierda" class="ctrl" data-k="left">◀</button><button aria-label="Mover a la derecha" class="ctrl" data-k="right">▶</button><button aria-label="Mover abajo" class="ctrl" data-k="down">▼</button></div><button aria-label="Mantener presionado para construir" class="action build" data-k="build">🏗<small>CONSTRUIR</small></button><button aria-label="Disparar un libro" class="action" data-k="fire">▰<small>DISPARAR<br>LIBRO</small></button></div>
</div></main>
<script>
const c=document.getElementById('game'),x=c.getContext('2d');x.imageSmoothingEnabled=false;
const W=960,H=540,keys={},stars=Array.from({length:30},()=>({x:Math.random()*W,y:Math.random()*150,s:Math.random()<.7?2:3}));
let state,raf,last=0;
const projects=[
 {x:150,y:255,type:'ESCUELA',seconds:4,color:'#efb735'},
 {x:380,y:215,type:'HOSPITAL',seconds:6,color:'#e9e8df'},
 {x:650,y:255,type:'UNIVERSIDAD',seconds:8,color:'#9d79d6'},
 {x:820,y:390,type:'POLO TECNOLÓGICO',seconds:10,color:'#3da8c5'},
 {x:610,y:440,type:'VIVIENDAS',seconds:12,color:'#e27636'},
 {x:340,y:430,type:'CENTRO DEPORTIVO',seconds:14,color:'#5bc66f'},
 {x:120,y:430,type:'GRAN OBRA',seconds:17,color:'#db6155'}
];
function reset(){state={run:true,t:0,score:0,confidence:100,player:{x:470,y:340,vx:0,vy:0,face:1,cool:0,throwT:0},pads:projects.map((p,i)=>({...p,index:i,done:false,build:0})),people:[],haters:[],shots:[],sparks:[],spawn:0,active:0,msg:'ANDÁ A LA PRIMERA OBRA',msgT:180,building:false};}
function rect(a,b,w,h,col){x.fillStyle=col;x.fillRect(Math.round(a),Math.round(b),w,h)}
function text(t,a,b,size=18,col='#fff',align='left'){x.fillStyle=col;x.font=`${size}px VT323`;x.textAlign=align;x.fillText(t,a,b)}
function bg(){rect(0,0,W,H,'#74c7df');stars.forEach(s=>rect(s.x,s.y,s.s,s.s,'#d9f6ff'));rect(0,145,W,80,'#bfe26e');rect(0,215,W,325,'#6eb95d');for(let i=0;i<12;i++){let bx=i*84-20,h=45+(i%4)*18;rect(bx,175-h,67,h,'#adc0c0');rect(bx+8,186-h,10,8,'#5e7787');rect(bx+38,186-h,10,8,'#5e7787')}rect(0,346,W,96,'#646c72');rect(0,350,W,5,'#f4d44c');rect(0,433,W,5,'#f4d44c');for(let i=0;i<9;i++)rect(i*125,391,72,6,'#dfe2d8');}
function drawPad(p){let locked=p.index>state.active;if(locked)x.globalAlpha=.35;let stage=p.done?100:p.build,h=18+stage*.72;rect(p.x-63,p.y+12,126,9,'#263049');rect(p.x-63,p.y+12,126*stage/100,9,p.done?'#54d978':'#ffd24a');text(p.done?'COMPLETA':`${Math.floor(stage)}%`,p.x,p.y+38,17,locked?'#95a0af':'#fff','center');if(stage<1){rect(p.x-52,p.y-23,104,35,'#8b7044');for(let i=0;i<5;i++)rect(p.x-44+i*20,p.y-16,14,9,'#dc9844');text(p.type,p.x,p.y-34,p.type.length>13?14:18,locked?'#8f9aaa':'#fff','center')}else{rect(p.x-58,p.y-h+12,116,h,p.color);rect(p.x-66,p.y-h,132,14,p.type==='HOSPITAL'?'#e33f4b':'#9b3e3d');for(let r=0;r<3;r++)for(let q=0;q<4;q++)rect(p.x-46+q*27,p.y-h+24+r*18,18,11,'#79c6df');rect(p.x-12,p.y-12,24,24,'#5a4236');if(p.type==='HOSPITAL'){rect(p.x-7,p.y-h+20,14,34,'#e33f4b');rect(p.x-19,p.y-h+31,38,12,'#e33f4b')}text(p.type,p.x,p.y-h-7,p.type.length>13?14:17,'#fff','center')}if(state.active===p.index&&!p.done){x.strokeStyle=state.building?'#fff':'#ffd24a';x.lineWidth=3;x.strokeRect(p.x-70,p.y-h-12,140,h+64)}x.globalAlpha=1}
function buda(p){let a=Math.round(p.x),b=Math.round(p.y)+Math.sin(state.t*.18)*1.5;rect(a-16,b+8,32,22,'#101522');rect(a-19,b-7,38,19,'#141925');x.save();x.translate(a,b);x.rotate(-.68);rect(-5,-9,10,40,'#cf2f3d');x.restore();rect(a-15,b-28,30,24,'#e0a273');rect(a-18,b-33,36,11,'#101522');rect(a-15,b-38,14,9,'#101522');rect(a,b-40,17,10,'#101522');rect(a-12,b-17,8,4,'#1b2030');rect(a+5,b-17,8,4,'#1b2030');rect(a-6,b-8,13,4,'#a33d60');rect(a-17,b+28,12,7,'#0d111b');rect(a+6,b+28,12,7,'#0d111b');if(p.throwT>0){rect(a+p.face*17,b-4,12,6,'#e1aa78');rect(a+p.face*28,b-7,12,9,'#f4e8b3')}else{rect(a+13,b-3,7,14,'#e1aa78');rect(a+14,b-11,4,10,'#e1aa78');rect(a+20,b-10,4,10,'#e1aa78')}}
function drawPerson(p){rect(p.x-6,p.y-10,12,17,p.col);rect(p.x-5,p.y-17,10,8,p.skin);rect(p.x-6,p.y-20,12,5,p.hair);rect(p.x-5,p.y+7,4,7,'#24304a');rect(p.x+2,p.y+7,4,7,'#24304a');if(p.star)text('★',p.x,p.y-25,16,'#ffd345','center')}
function drawHater(h){let bob=Math.sin(state.t*.2+h.seed)*3;rect(h.x-12,h.y-12+bob,24,24,'#4b2f63');rect(h.x-8,h.y-22+bob,16,12,'#6e4389');rect(h.x-12,h.y-24+bob,8,8,'#293040');rect(h.x+4,h.y-24+bob,8,8,'#293040');rect(h.x-7,h.y-18+bob,5,4,'#ff4f64');rect(h.x+3,h.y-18+bob,5,4,'#ff4f64');rect(h.x-8,h.y+12+bob,6,8,'#33243f');rect(h.x+3,h.y+12+bob,6,8,'#33243f')}
function dist(a,b){return Math.hypot(a.x-b.x,a.y-b.y)}
function update(){let s=state,p=s.player,sp=2.7;p.vx=((keys.right||keys.ArrowRight||keys.d)?1:0)-((keys.left||keys.ArrowLeft||keys.a)?1:0);p.vy=((keys.down||keys.ArrowDown||keys.s)?1:0)-((keys.up||keys.ArrowUp||keys.w)?1:0);if(p.vx&&p.vy){p.vx*=.707;p.vy*=.707}p.x=Math.max(25,Math.min(W-25,p.x+p.vx*sp));p.y=Math.max(180,Math.min(H-35,p.y+p.vy*sp));if(p.vx)p.face=Math.sign(p.vx);p.cool--;p.throwT--;
  let q=s.pads[s.active],near=q&&dist(p,q)<78;s.building=!!(q&&near&&(keys.build||keys[' ']||keys.Spacebar));if(s.building){q.build=Math.min(100,q.build+100/(q.seconds*60));if(q.build>=100&&!q.done){q.done=true;s.score+=500+(q.index*150);s.msg=`¡${q.type} INAUGURADA!`;s.msgT=130;for(let i=0;i<3;i++)setTimeout(()=>state&&state.run&&spawnPerson(q),i*400);s.active++;if(s.active>=s.pads.length)setTimeout(()=>finish(true),1500)}}else if((keys.build||keys[' '])&&!near){s.msg='ACERCATE A LA OBRA MARCADA';s.msgT=35}
  if((keys.fire||keys.Control)&&p.cool<=0){p.cool=18;p.throwT=10;s.shots.push({x:p.x+p.face*18,y:p.y-8,vx:p.face*8,life:65,spin:0});keys.fire=false}
  s.shots.forEach(o=>{o.x+=o.vx;o.life--;s.haters.forEach(h=>{if(!h.dead&&dist(o,h)<20){h.hp--;o.life=0;if(h.hp<=0){h.dead=true;s.score+=100;for(let i=0;i<7;i++)s.sparks.push({x:h.x,y:h.y,vx:Math.random()*4-2,vy:Math.random()*-3-1,life:35})}}})});s.shots=s.shots.filter(o=>o.life>0);s.haters=s.haters.filter(h=>!h.dead);
  s.spawn++;let interval=Math.max(48,170-s.active*17);if(s.spawn>interval){s.spawn=0;s.haters.push({x:Math.random()<.5?-18:978,y:215+Math.random()*290,hp:2+Math.floor(s.active/3),seed:Math.random()*6})}
  s.people.forEach(o=>{o.x+=o.vx;o.y+=o.vy;if(o.x<30||o.x>930)o.vx*=-1;if(o.y<230||o.y>500)o.vy*=-1});s.haters.forEach(h=>{let dx=p.x-h.x,dy=p.y-h.y,d=Math.hypot(dx,dy)||1;h.x+=dx/d*(.8+s.active*.05);h.y+=dy/d*(.8+s.active*.05);if(d<22){s.confidence-=.13;p.x=Math.max(25,Math.min(W-25,p.x+dx/d*1.4));p.y=Math.max(180,Math.min(H-35,p.y+dy/d*1.4))}});s.sparks.forEach(z=>{z.x+=z.vx;z.y+=z.vy;z.vy+=.12;z.life--});s.sparks=s.sparks.filter(z=>z.life>0);s.msgT--;s.t++;
  if(s.confidence<=0)finish(false);
}
function spawnPerson(q){let colors={ESCUELA:'#4bc0d8',HOSPITAL:'#e8eef1',UNIVERSIDAD:'#9d79d6','POLO TECNOLÓGICO':'#4ed1d0',VIVIENDAS:'#ed9f36','CENTRO DEPORTIVO':'#61d477','GRAN OBRA':'#f06c66'};state.people.push({x:q.x,y:q.y+18,vx:(Math.random()-.5)*1.1,vy:.5+Math.random()*.5,col:colors[q.type]||'#4bc0d8',skin:['#8f573f','#d49a6a','#f0bd8b'][Math.floor(Math.random()*3)],hair:'#25202a',star:true});state.score+=50}
function render(){bg();state.pads.forEach(drawPad);state.people.forEach(drawPerson);state.haters.forEach(drawHater);state.shots.forEach(o=>{o.spin+=.15;x.save();x.translate(o.x,o.y);x.rotate(o.spin);rect(-10,-7,20,14,'#f3e7b8');rect(-1,-7,2,14,'#b14d49');x.restore()});state.sparks.forEach(z=>rect(z.x,z.y,3,3,'#ffd24a'));buda(state.player);
  rect(14,14,430,74,'#101525dd');text(`PUNTOS  ${state.score}`,28,40,24,'#ffd24a');text('CONFIANZA',28,67,18,'#fff');rect(132,53,285,15,'#3b4051');rect(132,53,Math.max(0,285*state.confidence/100),15,state.confidence>35?'#54d978':'#ff5365');text(`${Math.max(0,Math.floor(state.confidence))}%`,275,66,17,'#101525','center');
  let built=state.pads.filter(q=>q.done).length;text(`OBRAS ${built}/${state.pads.length}   NIVEL ${Math.min(state.active+1,state.pads.length)}`,946,38,22,'#fff','right');let q=state.pads[state.active];if(q)text(`${q.type} · ${q.seconds}s`,946,66,20,'#ffd24a','right');if(state.msgT>0){rect(295,474,370,42,'#101525dd');text(state.msg,480,503,23,'#ffd24a','center')}text('ESPACIO: construir · CTRL: disparar libro',946,513,18,'#dbe6ff','right')
}
function loop(t){if(!state||!state.run)return;let dt=t-last;if(dt>14){update();render();last=t}raf=requestAnimationFrame(loop)}
function finish(win){state.run=false;cancelAnimationFrame(raf);document.getElementById('end').classList.remove('hidden');document.getElementById('endTitle').textContent=win?'¡CIUDAD IMPARABLE!':'LOS MONSTRUOS GANARON ESTA VEZ';document.getElementById('endText').innerHTML=win?`Completaste las ${state.pads.length} obras y la ciudad está llena de oportunidades.<br><span class="yellow">Puntaje: ${state.score}</span>`:'La confianza llegó a cero. Alterná entre construir y defenderte con los libros.'}
function start(){document.getElementById('start').classList.add('hidden');document.getElementById('end').classList.add('hidden');reset();render();last=performance.now();raf=requestAnimationFrame(loop)}
addEventListener('keydown',e=>{keys[e.key]=true;if(e.code==='Space'){keys.build=true;e.preventDefault()}});addEventListener('keyup',e=>{keys[e.key]=false;if(e.code==='Space')keys.build=false});document.querySelectorAll('[data-k]').forEach(b=>{let k=b.dataset.k;b.addEventListener('pointerdown',e=>{e.preventDefault();b.setPointerCapture(e.pointerId);keys[k]=true});b.addEventListener('pointerup',e=>{e.preventDefault();keys[k]=false});b.addEventListener('pointercancel',()=>keys[k]=false)});document.getElementById('play').onclick=start;document.getElementById('again').onclick=start;reset();state.run=false;render();
</script>
</body></html>
